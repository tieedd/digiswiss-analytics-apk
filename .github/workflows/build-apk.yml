name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Java could not be detected"
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version is less than 17 ($JAVA_MAJOR detected)"
            exit 1
          fi
          echo "Java version $JAVA_MAJOR is active."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Failed to create debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK not found at app/build/outputs/apk/debug/app-debug.apk"
            find app/build/outputs/apk -type f
            exit 1
          fi
          if [ ! -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK is empty"
            exit 1
          fi
          echo "APK successfully verified."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p temp_release
          cp app/build/outputs/apk/debug/app-debug.apk temp_release/app-debug.apk
          echo "asset_path=temp_release/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Release asset not found!"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Release asset is empty!"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES="Ini adalah APK debug yang dihasilkan secara otomatis.
          APK dibangun oleh GitHub Actions.
          Nomor eksekusi GitHub Actions (run number): ${{ github.run_number }}
          Percobaan eksekusi GitHub Actions (run attempt): ${{ github.run_attempt }}
          SHA komit sumber: ${{ github.sha }}
          APK ditujukan untuk pengujian.
          APK bukan merupakan rilis produksi Play Store.
          APK hanya ditandatangani dengan keystore debug sementara."
          
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            gh release view "debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release Tag: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: https://github.com/${{ github.repository }}/releases/latest"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "Normal Actions artifact 'app-debug-apk' remains available as a backup."
          else
            echo "WARNING: Release publication failed."
            echo "If the APK build was successful, it is still available."
            echo "Normal Actions artifact 'app-debug-apk' remains available as a backup."
          fi
